name: CI
on:
  push:
    branches: [main, 'yamd-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-yamd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-yamd/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:panels
      - run: npx vsce package --no-dependencies --allow-missing-repository --skip-license
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-yamd/*.vsix

  integration:
    # Starts a real VS Code window; allowed to fail until it has run on a hosted runner.
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    defaults:
      run:
        working-directory: vscode-yamd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-yamd/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a node scripts/integration.mjs
      - run: xvfb-run -a node scripts/integration.mjs --untrusted
